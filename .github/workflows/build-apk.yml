name: Build Android APK

on:
  push:
    paths:
      - 'web/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set);
      # Gradle downloads any missing platform or build-tools itself.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk StainlessCraft.apk
          cp StainlessCraft.apk BlockCraft.apk   # the old download link keeps working

      - uses: actions/upload-artifact@v4
        with:
          name: StainlessCraft-apk
          path: StainlessCraft.apk

      # Publish to a release so the APK can be downloaded straight from a phone.
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Stainless Craft APK (latest build)
          prerelease: true
          files: |
            StainlessCraft.apk
            BlockCraft.apk
          body: |
            Latest Stainless Craft build from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **StainlessCraft.apk** on your Android phone and open it to install.
            (BlockCraft.apk is the same file, kept so old links still work.)
