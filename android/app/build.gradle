plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blockcraft.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.blockcraft.game'
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName '6.1'
    }

    // The game (web/index.html) is packed into the app so it runs offline.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
