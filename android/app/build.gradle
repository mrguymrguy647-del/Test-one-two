plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blockcraft.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.blockcraft.game'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // The game itself lives in ../../web so the browser version and the app share one file.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
