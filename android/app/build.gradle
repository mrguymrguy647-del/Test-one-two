plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blockcraft.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.blockcraft.game'
        minSdk 21
        targetSdk 34
        versionCode 20
        versionName '8.2'
    }

    // Every build is signed with the same key, so a new version installs over the old one and keeps your worlds.
    signingConfigs {
        stainless {
            storeFile file('stainless.keystore')
            storePassword 'stainlesscraft'
            keyAlias 'stainless'
            keyPassword 'stainlesscraft'
        }
    }

    // The game (web/index.html) is packed into the app so it runs offline.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stainless
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stainless
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
